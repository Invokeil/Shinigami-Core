name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          SHINIGAMI_KEYSTORE_BASE64: ${{ secrets.SHINIGAMI_KEYSTORE_BASE64 }}
          SHINIGAMI_KEYSTORE_PASSWORD: ${{ secrets.SHINIGAMI_KEYSTORE_PASSWORD }}
          SHINIGAMI_KEY_ALIAS: ${{ secrets.SHINIGAMI_KEY_ALIAS }}
          SHINIGAMI_KEY_PASSWORD: ${{ secrets.SHINIGAMI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract version name
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # semver tag (vX.Y.Z) -> monotonic versionCode (X*10000 + Y*100 + Z)
          CODE=$(echo "${GITHUB_REF_NAME}" | sed 's/^v//' | cut -d. -f1-3 | awk -F. '{print $1*10000 + $2*100 + $3}')
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             Shinigami-Core-${{ steps.version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Shinigami Core ${{ steps.version.outputs.tag }}
          body: |
            ## Shinigami Core ${{ steps.version.outputs.tag }}

            **SHINIGAMI — by Invokeil**

            versionCode: ${{ steps.version.outputs.code }}

            ### Install
            1. Download `Shinigami-Core-${{ steps.version.outputs.tag }}.apk` below.
            2. Allow "Install unknown apps" for your browser if asked.
            3. Install and say **"Hey Shini"**.

            ### Requirements
            - Android 10.0+

            ### Notes
            - The assistant works fully offline for everyday commands.
            - Connect your own AI provider (OpenAI / Gemini / Mistral / GLM / Ollama / any OpenAI-compatible endpoint) in **Providers**.
            - Nothing is collected; see PRIVACY.md for the full policy.
          draft: false
          prerelease: false
          files: |
            Shinigami-Core-*.apk
            components.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
